name: PR Lint Bot

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PR Lint Bot
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}  # Use a GitHub Secret
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python app.py
